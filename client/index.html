<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>转正倒计时</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div id="status" class="card">
        <div id="clock"></div>
        <div class="stat"><span>KPI</span><b id="kpi">0</b></div>
        <div class="stat"><span>精力</span><div class="bar"><i id="energy"></i></div></div>
        <div class="stat"><span>警告</span><div id="warns"></div></div>
        <div id="perks"></div>
      </div>
      <div id="tasks" class="card"></div>
      <div id="banner" hidden></div>
      <div id="toasts"></div>
      <div id="crosshair"></div>
      <div id="exposure" hidden><span>👁 被盯上了！快停手</span><div class="bar"><i></i></div></div>
      <div id="busy" hidden></div>
      <div id="prompts"></div>
      <canvas id="minimap"></canvas>
      <div id="panel" class="card" hidden></div>
      <div id="mg" class="card" hidden></div>
      <div id="lockhint">点击画面开始操作</div>
      <div id="vignette"></div>
    </div>

    <form id="menu" class="card" autocomplete="off">
      <h1>转正倒计时</h1>
      <p class="tagline">鲸跃科技 2026 届实习生 · 名额有限 · 各凭本事</p>
      <label>工牌姓名<input id="name" maxlength="10" placeholder="实习生" /></label>
      <button id="create" type="submit">创建房间</button>
      <div class="join">
        <input id="code" inputmode="numeric" maxlength="4" placeholder="4 位房间号" />
        <button id="join" type="button">加入房间</button>
      </div>
      <p id="menu-error" role="alert"></p>
      <p class="help">WASD 移动 · 鼠标转向 · 空格跳跃 · E / F 互动 · C 推人 · V 丢香蕉皮 · Q 摸鱼 · R 举报 · G 吃零食 · X 丢弃 · Tab 排名</p>
    </form>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
